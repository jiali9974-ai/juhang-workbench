[unix_http_server]
file=/root/autodl-tmp/jh-workbench/supervisor.sock
chmod=0700

[supervisord]
logfile=/root/autodl-tmp/jh-workbench/logs/supervisord.log
pidfile=/root/autodl-tmp/jh-workbench/supervisord.pid
childlogdir=/root/autodl-tmp/jh-workbench/logs
logfile_maxbytes=10MB
logfile_backups=3

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///root/autodl-tmp/jh-workbench/supervisor.sock

[program:jh-workbench]
command=/bin/bash /root/autodl-tmp/jh-workbench/automation/run-app.sh
directory=/root/autodl-tmp/jh-workbench
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/root/autodl-tmp/jh-workbench/logs/app.log
stderr_logfile=/root/autodl-tmp/jh-workbench/logs/app-error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3

[program:jh-git-sync]
command=/root/miniconda3/bin/python /root/autodl-tmp/jh-workbench/automation/sync.py --loop
directory=/root/autodl-tmp/jh-workbench
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/root/autodl-tmp/jh-workbench/logs/sync.log
stderr_logfile=/root/autodl-tmp/jh-workbench/logs/sync-error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
environment=PYTHONUNBUFFERED="1"
