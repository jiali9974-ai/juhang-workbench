# 巨航剪辑工作台：独立端口 8765，带登录密码，转发到本机 127.0.0.1:18765。不影响 80 端口上的其它站点。
server {
    listen 8765;
    listen [::]:8765;
    server_name _;

    auth_basic "JH Workbench";
    auth_basic_user_file /etc/nginx/jh-workbench.htpasswd;

    client_max_body_size 0;          # 素材视频可能几个 GB
    proxy_request_buffering off;     # 上传边收边转发，不先落 nginx 临时文件
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # GitHub cannot use the UI's login; this receiver verifies the HMAC signature.
    location = /__jh_git_push {
        auth_basic off;
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:18766;
        proxy_read_timeout 15s;
    }

    location / {
        proxy_pass http://127.0.0.1:18765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
